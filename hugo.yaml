baseURL: "https://sidwyn.com/"
title: Sidwyn's Homepage
theme: PaperMod

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  assets:
    favicon: "/favicon.svg"
  homeInfoParams:
    Title: "👋 Hi, I'm Sidwyn"
    Content: >
      <img src="https://substackcdn.com/image/fetch/$s_!kJcm!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F17301c61-d1ab-4324-9cab-340b73bb6a6d_2100x2100.jpeg"
      alt="Sidwyn Koh" width="120" height="120"
      style="border-radius: 50%; float: right; margin: 0 0 12px 16px;" />
      I've built products at Meta, Lyft, and GoFundMe, and [sold a startup](https://www.techinasia.com/asian-startup-schools-unite-taipeis-alpha-camp-acquires-singapores-pragmatic-lab) along the way. I write about programming and technology here,
      and about engineering career growth at [PathToStaff.com](https://pathtostaff.com).<br/><br/> I also angel invest in early-stage startups and advise founders on product & engineering. [Email me](mailto:sidwyn@gmail.com) if you're interested in working together.
      <br/><br/>I also occasionally write technical posts, subscribe if you're interested:
      <form action="https://sidwyn.substack.com/api/v1/free?nojs=true" method="post"
      target="_blank" style="margin-top: 16px; display: flex; gap: 10px; max-width: 460px;
      padding: 6px; background: var(--entry); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);">
      <input type="email" name="email" placeholder="your@email.com" required
      style="flex: 1; min-width: 0; padding: 11px 14px; border: none; border-radius: 7px;
      background: transparent; color: var(--primary); font-size: 15px; outline: none;" />
      <input type="submit" value="Subscribe →"
      style="padding: 11px 20px; border: none; border-radius: 7px; background: var(--primary);
      color: var(--theme); cursor: pointer; font-weight: 600; font-size: 15px; white-space: nowrap;" />
      </form>
  ShowReadingTime: true
  ShowShareButtons: false
  socialIcons:
    - name: github
